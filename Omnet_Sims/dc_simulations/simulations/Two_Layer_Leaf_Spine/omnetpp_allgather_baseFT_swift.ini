
[Config UDP_ECMP_single_sender_capped_bw]

############ REQUIRES POTENTIAL CHANGE #######################
network = FTGPU100

**.ipv4.ip.timeToLive = ${ttl = 250}
**.useECMP = ${usingECMP = true}
**.use_per_pkt_lb = ${usingPacketSpray = false}
**.use_power_of_n_lb = ${usingPowerOfNLB = false}
**.random_power_factor = ${aggRandomPowerFactor = 2}

repeat = 1
sim-time-limit = ${simTimeLimit = 5.2}s

**.num_gpus = ${numGPUs = 8}
**.mcast_in_host = ${mcastInHost = true}
**.nvlink_speed_gbps = ${nvlinkGbps = 7200}
#**.server[*].app[*].initiation_delay_mean = 0.001 # 3us
#**.server[*].app[*].initiation_delay_stddev = 0.0005 # 1us
#**.server[*].app[*].processing_delay_mean = 0.001 # 3us
#**.server[*].app[*].processing_delay_stddev = 0.0005 # 1us


**.k = ${K = 8}
**.num_servers = ${numServersPerEdge = 2}
**.num_bursty_apps = ${numBurstyApps = 0}
**.server[*].app[*].num_flows_per_ml_query = ${numFlowsPerMLQuery = 64}
**.num_mice_background_flow_apps_in_each_server = ${numMiceBackgroundFlowAppsInEachServer = 0}
**.num_ml_apps_in_each_server = ${numMLAppsInEachServer = 1}


###############################  UDP Config ###################
**.use_udp = true
**.server[*].app[*].mss = 1452
**.packet_creation_batch_size = 10
**.server[*].eth[*].mac.typename = ${serverMacTypeName = "AugmentedEtherMacFullDuplex"}
###############################  UDP Config ###################

###############################  Swift Config ###################
**.rate_control_type = "swift"
**.base_target_delay = ${baseTargetDelay = 0.0000264}		# 0.00003
**.per_hop_scaling_factor = ${perHopScalingFactor = 0.0000132}    # h
**.max_cwnd_target_scaling = ${maxCwndTargetScaling = 100}    # fs_max_cwnd
**.min_cwnd_target_scaling = ${minCwndTargetScaling = 0.1}  # fs_min_cwnd
**.max_scaling_range = ${maxScalingRange = 5*$baseTargetDelay}    # fs_range
**.additive_increase_constant = ${additiveIncreaseConstant = 1}     # ai: fabric additive increament
**.multiplicative_decrease_constant = ${multiplicativeDecreaseConstant = 0.8}       # beta: fabric multiplicative decrease constant
**.max_mdf = ${maxMdf = 0.5}        # fabric maximum multiplicative decrease factor

**.dcqcn_mtu = 1500	# 1500 bytes
**.server[*].eth[*].mac.queue_insert_thresh = 1000
# initial rate is link bw divided by dcqcn_initial_rate_devider
**.server[*].eth[*].mac.dcqcn_initial_rate_devider = ${initialRateDevider = $numFlowsPerMLQuery}
**.server[*].eth[*].mac.dcqcn_limit_max_rate = true

**.use_fattree = true
###############################  Swift Config ###################

**.server[*].app[1].startTime = 0s
**.server[*].app[1].flow_size = ${mlflowSize = 2000000}B
#**.server[*].app[1].requestLength = 250B
**.server[*].app[1].application_category = ${serverApplicationCategory = "web"}
**.server[*].app[1].inter_arrival_time_multiplier = ${MLInterArrivalMultiplier = 200.0}
**.server[*].app[1..].background_inter_arrival_time_multiplier = ${bgInterArrivalMultiplier = 0.2428}
**.server[*].app[1..].bursty_inter_arrival_time_multiplier = ${burstyInterArrivalMultiplier = 0.125}
**.server[*].app[1..].replyLength = ${incastFlowSize = 40000}B
**.server[*].app[1..].num_requests_per_burst = ${numReqPerBurst = 100}
**.server[*].app[1].distibutions_base_root = "./"

**.edge[*].eth[*].mac.queue.typename = ${edgeQueueType = "V2PIFO"}
**.edge[*].eth[*].mac.queue.dataCapacity = ${edgeQueueSizePacketBytes = 500000}B
**.edge[*].use_v2_pifo = ${edgeUseV2Pifo = true}
**.edge[*].eth[*].mac.queue.dropper_type = ${edgeDropperType = "FIFO"}
**.edge[*].eth[*].mac.queue.scheduler_type = ${edgeSchedulerType = "FIFO"}
**.edge[*].eth[*].mac.queue.red_kmin = ${edgeQueueRedKMin = 3} # Almost 5KB
**.edge[*].eth[*].mac.queue.red_kmax = ${edgeQueueRedKMax = 15} # Almost 200KB
**.edge[*].eth[*].mac.queue.red_pmax = ${edgeQueueRedPMax = 0.01}

**.agg[*].eth[*].mac.queue.typename = ${aggQueueType = $edgeQueueType}
**.agg[*].eth[*].mac.queue.dataCapacity = ${aggQueueSizePacketBytes = $edgeQueueSizePacketBytes}B
**.agg[*].use_v2_pifo = ${aggUseV2Pifo = $edgeUseV2Pifo}
**.agg[*].eth[*].mac.queue.dropper_type = ${aggDropperType = $edgeDropperType}
**.agg[*].eth[*].mac.queue.scheduler_type = ${aggSchedulerType = $edgeSchedulerType}
**.agg[*].eth[*].mac.queue.red_kmin = ${aggQueueRedKMin = $edgeQueueRedKMin} # Almost 5KB
**.agg[*].eth[*].mac.queue.red_kmax = ${aggQueueRedKMax = $edgeQueueRedKMax} # Almost 200KB
**.agg[*].eth[*].mac.queue.red_pmax = ${aggQueueRedPMax = $edgeQueueRedPMax}

**.core[*].eth[*].mac.queue.typename = ${coreQueueType = $edgeQueueType}
**.core[*].eth[*].mac.queue.dataCapacity = ${coreQueueSizePacketBytes = $edgeQueueSizePacketBytes}B
**.core[*].use_v2_pifo = ${coreUseV2Pifo = $edgeUseV2Pifo}
**.core[*].eth[*].mac.queue.dropper_type = ${coreDropperType = $edgeDropperType}
**.core[*].eth[*].mac.queue.scheduler_type = ${coreSchedulerType = $edgeSchedulerType}
**.core[*].eth[*].mac.queue.red_kmin = ${coreQueueRedKMin = $edgeQueueRedKMin}
**.core[*].eth[*].mac.queue.red_kmax = ${coreQueueRedKMax = $edgeQueueRedKMax}
**.core[*].eth[*].mac.queue.red_pmax = ${coreQueueRedPMax = $edgeQueueRedPMax}

**.edge[*].eth[*].mac.typename = ${edgeMacTypeName = "AugmentedEtherMac"}
**.agg[*].eth[*].mac.typename = ${aggMacTypeName = $edgeMacTypeName}
**.core[*].eth[*].mac.typename = ${coreMacTypeName = $edgeMacTypeName}
**.edge[*].relayUnit.typename = ${edgeRelayTypeName = "BouncingIeee8021dRelay"}
**.agg[*].relayUnit.typename = ${aggRelayTypeName = $edgeRelayTypeName}
**.core[*].relayUnit.typename = ${coreRelayTypeName = $edgeRelayTypeName}

**.server[*].app[1..].use_jitter = ${server0UseJitter = false}

# PFC
**.use_pfc = ${UsePFC = true}
**.pfc_stop_perc = ${pfcStopPerc = 0.11}
**.pfc_resume_gap = ${pfcResumeGap = 5}

**.arp.typename = "GlobalArp"
**.edge[*].learn_mac_addresses = false
**.agg[*].learn_mac_addresses = false
**.core[*].learn_mac_addresses = false
**.edge[*].macTable.addressTableFile ="./MAC_Table_Data/fat_tree_edge[" + string(parentIndex()) + "].txt"
**.agg[*].macTable.addressTableFile ="./MAC_Table_Data/fat_tree_agg[" + string(parentIndex()) + "].txt"
**.core[*].macTable.addressTableFile ="./MAC_Table_Data/fat_tree_core[" + string(parentIndex()) + "].txt"


**.server[*].numApps = ${server0NumApps = 1 + $numMiceBackgroundFlowAppsInEachServer + $numBurstyApps + $numMLAppsInEachServer}
**.server[*].app[0].typename = "UDPLongBroadcastPasserApp"
#**.server[*].app[0].typename = "DCTcpGenericServerApp"
**.server[*].app[0].localPort = 80
**.server[*].app[1].typename = "UDPLongAllgatherInitiatorApp"

**.server[*].app[1..].collective_type_str = ${Collective = "allgather"}
**.server[*].app[1..].collective_alg_type_str = ${CollectiveAlg = "singlesender"}
**.use_host_assisted_routing = ${usingHostAssistedRouting = false}
**.server[*].app[*].is_message_splitted = false
**.server[*].app[*].splitted_chunk_size_bytes = 10000

cmdenv-output-file = results/${K}_ft_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.out
output-scalar-file = results/${K}_ft_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.sca
output-vector-file = results/${K}_ft_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.vec
eventlog-file = results/${K}_ft_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.elog
snapshot-file = results/${K}_ft_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.sna



