

[Config ring]

############ REQUIRES POTENTIAL CHANGE #######################
network = LSGPU100

**.ipv4.ip.timeToLive = ${ttl = 250}
**.useECMP = ${usingECMP = false}
**.use_per_pkt_lb = ${usingPacketSpray = true}
**.use_power_of_n_lb = ${usingPowerOfNLB = false}
**.agg[*].random_power_factor = ${aggRandomPowerFactor = 2}
**.spine[*].random_power_factor = ${spineRandomPowerFactor = $aggRandomPowerFactor}

repeat = 1
sim-time-limit = ${simTimeLimit = 1.2}s

**.num_gpus = ${numGPUs = 8}
**.mcast_in_host = ${mcastInHost = false}
**.nvlink_speed_gbps = ${nvlinkGbps = 7200}
#**.server[*].app[*].initiation_delay_mean = 0.001 # 3us
#**.server[*].app[*].initiation_delay_stddev = 0.0005 # 1us
#**.server[*].app[*].processing_delay_mean = 0.001 # 3us
#**.server[*].app[*].processing_delay_stddev = 0.0005 # 1us


###############################  UDP Config ###################
**.use_udp = true
**.server[*].app[*].mss = 1452
**.packet_creation_batch_size = 10
**.server[*].eth[*].mac.typename = ${serverMacTypeName = "AugmentedEtherMacFullDuplex"}
###############################  UDP Config ###################

###############################  DCQCN Config ###################

**.server[*].eth[*].mac.cnp_generation_gap = 0.000050s	# 50 microseconds 
**.server[*].eth[*].mac.dcqcn_init_alpha = 1
**.server[*].eth[*].mac.dcqcn_init_g = 0.00390625	# 1/256
**.server[*].eth[*].mac.dcqcn_init_byte_counter = 10000000	# 10 MB
**.server[*].eth[*].mac.increase_timer_gap = 0.000055	# 55 microseconds
**.server[*].eth[*].mac.alpha_timer_gap = 0.000055	# 55 microseconds
**.server[*].eth[*].mac.dcqcn_F = 5
**.server[*].eth[*].mac.dcqcn_HI_factor = 50000000	# 50 Mbps
**.server[*].eth[*].mac.dcqcn_AI_factor = 5000000	# 5 Mbps
**.dcqcn_mtu = 1500	# 1500 bytes
**.server[*].eth[*].mac.queue_insert_thresh = 1000
###############################  DCQCN Config ###################


**.num_spines = ${numSpines = 16}
**.num_aggs = ${numAggs = 32}
**.num_servers = ${numServers = 2}
**.num_bursty_apps = ${numBurstyApps = 0}
**.server[*].app[*].num_flows_per_ml_query = ${numFlowsPerMLQuery = 64}
**.num_mice_background_flow_apps_in_each_server = ${numMiceBackgroundFlowAppsInEachServer = 0}
**.num_ml_apps_in_each_server = ${numMLAppsInEachServer = 1}

**.server[*].app[1].startTime = 0s
**.server[*].app[1].flow_size = ${mlflowSize = 2000000, 8000000, 32000000, 128000000, 512000000}B
#**.frag_ratio = 0.5
**.server[*].app[1].application_category = ${serverApplicationCategory = "web"}
**.server[*].app[1].inter_arrival_time_multiplier = ${MLInterArrivalMultiplier = 0.039996, 0.159984, 0.639936, 2.559744, 10.238976 ! mlflowSize}
**.server[*].app[1..].background_inter_arrival_time_multiplier = ${bgInterArrivalMultiplier = 0.2428}
**.server[*].app[1..].bursty_inter_arrival_time_multiplier = ${burstyInterArrivalMultiplier = 0.125}
**.server[*].app[1..].replyLength = ${incastFlowSize = 40000}B
**.server[*].app[1..].num_requests_per_burst = ${numReqPerBurst = 100}
**.server[*].app[1].distibutions_base_root = "./"

**.agg[*].eth[*].mac.queue.typename = ${aggQueueType = "V2PIFO"}
**.agg[*].eth[*].mac.queue.dataCapacity = ${aggQueueSizePacketBytes = 500000}B
**.agg[*].use_v2_pifo = ${aggUseV2Pifo = true}
**.agg[*].eth[*].mac.queue.dropper_type = ${aggDropperType = "FIFO"}
**.agg[*].eth[*].mac.queue.scheduler_type = ${aggSchedulerType = "FIFO"}
**.agg[*].eth[*].mac.queue.red_kmin = ${aggQueueRedKMin = 3} # Almost 5KB
**.agg[*].eth[*].mac.queue.red_kmax = ${aggQueueRedKMax = 15} # Almost 200KB
**.agg[*].eth[*].mac.queue.red_pmax = ${aggQueueRedPMax = 0.01}

**.spine[*].eth[*].mac.queue.typename = ${spineQueueType = $aggQueueType}
**.spine[*].eth[*].mac.queue.dataCapacity = ${spineQueueSizePacketBytes = $aggQueueSizePacketBytes}B
**.spine[*].use_v2_pifo = ${spineUseV2Pifo = $aggUseV2Pifo}
**.spine[*].eth[*].mac.queue.dropper_type = ${spineDropperType = $aggDropperType}
**.spine[*].eth[*].mac.queue.scheduler_type = ${spineSchedulerType = $aggSchedulerType}
**.spine[*].eth[*].mac.queue.red_kmin = ${spineQueueRedKMin = $aggQueueRedKMin}
**.spine[*].eth[*].mac.queue.red_kmax = ${spineQueueRedKMax = $aggQueueRedKMax}
**.spine[*].eth[*].mac.queue.red_pmax = ${spineQueueRedPMax = $aggQueueRedPMax}

**.agg[*].eth[*].mac.typename = ${aggMacTypeName = "AugmentedEtherMac"}
**.spine[*].eth[*].mac.typename = ${spineMacTypeName = $aggMacTypeName}
**.agg[*].relayUnit.typename = ${aggRelayTypeName = "BouncingIeee8021dRelay"}
**.spine[*].relayUnit.typename = ${spineRelayTypeName = $aggRelayTypeName}

**.server[*].app[1..].use_jitter = ${server0UseJitter = false}

# PFC
**.use_pfc = ${UsePFC = true}
**.pfc_stop_perc = ${pfcStopPerc = 0.11}
**.pfc_resume_gap = ${pfcResumeGap = 5}

#**.random_fail_prob = 0.01
#**.drop_type = "fail"
#**.recovery_type = "notif"
#**.failure_period_mean = 0.001
#**.failure_period_std = 0.0005

**.arp.typename = "GlobalArp"
**.agg[*].learn_mac_addresses = false
**.spine[*].learn_mac_addresses = false
**.agg[*].macTable.addressTableFile ="./MAC_Table_Data/agg[" + string(parentIndex()) + "].txt"
**.spine[*].macTable.addressTableFile ="./MAC_Table_Data/spine[" + string(parentIndex()) + "].txt"


**.server[*].numApps = ${server0NumApps = 1 + $numMiceBackgroundFlowAppsInEachServer + $numBurstyApps + $numMLAppsInEachServer}
**.server[*].app[0].typename = "UDPLongBroadcastPasserApp"
#**.server[*].app[0].typename = "DCTcpGenericServerApp"
**.server[*].app[0].localPort = 80
**.server[*].app[1].typename = "UDPLongAllgatherInitiatorApp"

**.server[*].app[1..].collective_type_str = ${Collective = "broadcast"}
**.server[*].app[1..].collective_alg_type_str = ${CollectiveAlg = "ring"}
**.use_host_assisted_routing = ${usingHostAssistedRouting = false}
**.server[*].app[*].is_message_splitted = true
**.server[*].app[*].splitted_subflow_num = ${subFlowNum = 8}


# spines_leafs_servers_LS
cmdenv-output-file = results/${numSpines}_${numAggs}_${numServers}_ls_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.out
output-scalar-file = results/${numSpines}_${numAggs}_${numServers}_ls_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.sca
output-vector-file = results/${numSpines}_${numAggs}_${numServers}_ls_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.vec
eventlog-file = results/${numSpines}_${numAggs}_${numServers}_ls_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.elog
snapshot-file = results/${numSpines}_${numAggs}_${numServers}_ls_${numMLAppsInEachServer}_mlapp_${numBurstyApps}_bursty_${numMiceBackgroundFlowAppsInEachServer}_bg_${numReqPerBurst}_reqpburst_${bgInterArrivalMultiplier}_bgintermult_${burstyInterArrivalMultiplier}_burstyintermult_${MLInterArrivalMultiplier}_mlqueryintermult_${repetition}_rep_${incastFlowSize}_incastfsize_${numFlowsPerMLQuery}_mlscale_${mlflowSize}_mlfsize_${numGPUs}_gpus_${nvlinkGbps}_nv.sna




